<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2236">
<title>秘密の数字と隠し部屋</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>/* ===== 配色（テーマ） ===== */
:root{
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --title:"Kaisei Decol","Hiragino Mincho ProN","Noto Serif JP",serif;
  --hand:"Klee One","Hiragino Maru Gothic ProN",sans-serif;
  /* 物語 */
  --s-bg:#eef1e4;--s-main:#3f5a46;--s-ink:#2e3a30;--s-pad:#c5ccc3;--s-cell:#fffdf8;--s-accent:#c98a2e;--s-thin:#c8c2b0;--s-black:#3f5a46;
  /* 隠し部屋 */
  --h-bg:#413d4e;--h-main:#b9aad8;--h-ink:#ece6f6;--h-cell:#efe7d6;--h-thin:#c9c2b6;--h-inf:#4c9cc4;--h-hard:#d0602c;--h-chal:#b98a1e;--h-black:#2b2536;
  --miss:#e2574c;--user:#2f6db3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15121b;overflow:hidden}
body{font-family:var(--title);user-select:none;-webkit-user-select:none;color:var(--s-ink)}
button{font-family:var(--title);cursor:pointer}
.scr{position:fixed;inset:0;display:none;justify-content:center;align-items:center}
.scr.active{display:flex}
/* 2:3の絵の枠（物語・タイトル・扉） */
.stage{position:relative;width:min(100vw,calc(100vh * 2 / 3));height:min(100vh,calc(100vw * 3 / 2));overflow:hidden;background:#000}
.stage>img.bg,.stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ===== 最初のタイトル ===== */
#t-bg{animation:drift 30s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes drift{from{transform:scale(1.03)}to{transform:scale(1.07)}}
.t-top{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(rgba(40,24,52,.55),rgba(40,24,52,0))}
.t-title{position:absolute;top:14%;left:0;right:0;text-align:center;color:#fff8ea}
.t-title .small{font-size:clamp(12px,3.6vw,17px);letter-spacing:.35em;font-weight:700;color:#f3dca6;text-shadow:0 2px 6px #0008;margin-top:.7em}
.t-title h1{margin:.25em 0 0;font-size:clamp(32px,10vw,52px);line-height:1.15;font-weight:900;letter-spacing:.06em;
  text-shadow:0 3px 0 #3f5a46,0 0 18px rgba(255,200,120,.55),0 4px 14px #000a}
.t-title h1 span{display:block;font-size:.6em;letter-spacing:.2em;margin-top:.1em}
.t-menu{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;gap:10px;padding:0 16px}
.t-menu button{flex:0 1 280px;border:none;border-radius:16px;padding:13px 0;font-size:17px;font-weight:700;letter-spacing:.1em;
  background:#fffdf8;color:var(--s-main);box-shadow:0 4px 0 #2e4434,0 8px 18px #0006}
.t-menu.two button{flex:0 1 170px;font-size:16px}
.t-menu button.sub{background:rgba(255,253,248,.18);color:#fff8ea;border:2px solid #fff8eacc;box-shadow:none}

/* ===== 物語の場面 ===== */
.layer{position:absolute;pointer-events:none}
#sc-stage.recall #sc-bust{filter:sepia(.45) saturate(.85) brightness(1.03)}
#sc-vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(90,70,40,.45) 100%)}
#sc-stage.recall #sc-vig{opacity:1}
#sc-tag{position:absolute;top:18px;left:56px;font-size:13px;color:#7a6650;letter-spacing:.2em;opacity:0;transition:opacity .6s}
#sc-stage.recall #sc-tag{opacity:1}
#sc-bust{position:absolute;left:4%;width:92%;bottom:22%;aspect-ratio:1;opacity:0;transition:opacity .8s}
#sc-bust.show{opacity:1}
#sc-bust .in{position:absolute;inset:0;animation:breath 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breath{50%{transform:scaleY(1.008)}}
#sc-bust img{position:absolute}
#sc-mouth,#sc-eyes{opacity:0}
#sc-doc{opacity:0;transition:opacity 1.2s}
#sc-doc.show{opacity:1}
.win{position:absolute;left:4%;right:4%;bottom:3%;min-height:19%;background:#fffdf8;border:4px solid var(--s-main);border-radius:14px;
  padding:26px 16px 14px;font-size:clamp(14px,4.2vw,17px);line-height:1.75;color:var(--s-ink);box-shadow:0 6px 16px #0005}
.win .name{position:absolute;top:-16px;left:14px;background:var(--s-main);color:#fff;font-weight:700;font-size:13px;padding:3px 12px;border-radius:10px}
.win .next{position:absolute;right:12px;bottom:6px;color:var(--s-main);opacity:0;animation:blink 1s infinite}
.win.done .next{opacity:1}
@keyframes blink{50%{opacity:.2}}
#sc-fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#sc-fade.on{opacity:1}
.skip{position:absolute;top:10px;right:10px;border:2px solid #fff8;background:#0005;color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;z-index:3}
/* メモの紙（机の上） */
#memo-paper{position:absolute;left:10%;right:10%;top:9%;bottom:24%;background:#fbf6e9;border-radius:6px;box-shadow:0 10px 28px #0007,inset 0 0 0 1px #e6dcc4;
  padding:18px 16px;display:none;flex-direction:column;align-items:center;color:#4a3a2a;
  background-image:repeating-linear-gradient(transparent 0 27px,#e8dcc4 27px 28px);transform:rotate(-1.2deg)}
#memo-paper.show{display:flex}
.hand{font-weight:700;letter-spacing:.06em}
.memo-title{font-size:clamp(15px,4.6vw,20px);margin:2px 0 10px;border-bottom:2px solid #c98a2e;padding-bottom:2px}

/* ===== メモ（進み具合） ===== */
#scr-memo{background:#1d1a22}
#memo-stage{display:flex;flex-direction:column;align-items:center}
#memo-bg,#sc-bg.blur{filter:blur(3px) brightness(.85)}
.memo-card{position:absolute;left:6%;right:6%;top:11%;bottom:24%;background:#fbf6e9;border-radius:8px;box-shadow:0 10px 30px #000a;
  padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;color:#4a3a2a;
  background-image:repeating-linear-gradient(transparent 0 31px,#ece2cc 31px 32px)}
.digits{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.digits .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#7a6650}
.digits .d b{width:clamp(40px,12vw,54px);height:clamp(48px,14vw,62px);border:2.5px solid #4a3a2a;border-radius:8px;background:#fffdf8;
  display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,32px);color:#c98a2e}
.plist{width:100%;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;padding-top:4px}
.pgroup{display:flex;align-items:center;gap:8px;font-size:14px}
.pgroup .gname{flex:0 0 auto;min-width:4.5em;font-weight:700;font-size:12px;white-space:nowrap;letter-spacing:-.02em}
.pgroup .steps{display:flex;gap:5px;flex:1}
.pgroup .st{flex:1;border:2px solid #4a3a2a;border-radius:8px;padding:5px 0;text-align:center;font-size:12px;background:#fffdf8;color:#4a3a2a}
.pgroup .st.done{background:#3f5a46;color:#fff;border-color:#3f5a46}
.pgroup .st.done::before{content:"✓ "}
.pgroup .st.open{background:#fff3dc;border-color:#c98a2e;color:#8a5a14;font-weight:700;box-shadow:0 3px 0 #c98a2e}
.pgroup button.st{font-family:var(--font)}
.pgroup .st.lock{opacity:.4}
.pgroup .st.lock::before{content:"🔒"}
.pgroup .st{padding:9px 0;font-size:13px}
@keyframes pulse{50%{transform:scale(1.05)}}
.memo-go{margin-top:10px;width:86%;border:none;border-radius:14px;padding:13px 0;font-size:17px;font-weight:700;background:#3f5a46;color:#fff;box-shadow:0 4px 0 #2a3e30}
.memo-back{margin-top:8px;border:none;background:none;color:#7a6650;font-size:13px;text-decoration:underline}

/* ===== パズル画面 ===== */
#scr-puzzle{flex-direction:column;justify-content:flex-start;padding:10px 16px 14px;overflow:auto;
  background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:18px 18px;color:var(--ink)}
#scr-puzzle.t-story{--bg:var(--s-bg);--main:var(--s-main);--ink:var(--s-ink);--padbg:var(--s-pad);--padink:var(--s-main);--cell:var(--s-cell);--line:var(--s-main);--thin:var(--s-thin);--accent:var(--s-accent);--accentInk:#fff;--black:var(--s-black);--dot:#00000010;--toolbg:#fff}
#scr-puzzle.t-inf,#scr-puzzle.t-hard,#scr-puzzle.t-challenge{--bg:var(--h-bg);--main:var(--h-main);--ink:var(--h-ink);--padbg:var(--h-main);--padink:#251d30;--cell:var(--h-cell);--line:#2a2a2a;--thin:var(--h-thin);--black:var(--h-black);--dot:#ffffff10;--toolbg:transparent;--accentInk:#fff}
#scr-puzzle.t-inf{--accent:var(--h-inf)}
#scr-puzzle.t-hard{--accent:var(--h-hard)}
#scr-puzzle.t-challenge{--accent:var(--h-chal)}
.pz-head{width:min(92vw,440px);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.pz-pause{border:2px solid var(--main);background:var(--toolbg);color:var(--main);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.pz-title{flex:1;font-weight:700;font-size:clamp(11px,3.4vw,16px);letter-spacing:-.02em;color:var(--main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--accent);color:var(--accentInk)}
.pz-sub{width:min(92vw,440px);display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
.lives span{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-left:4px}
.lives span.used{background:#0002}
#scr-puzzle.t-inf .lives span.used,#scr-puzzle.t-hard .lives span.used,#scr-puzzle.t-challenge .lives span.used{background:#fff2}
.boardwrap{width:min(92vw,440px,calc(100vh - 270px));display:flex;justify-content:center}
.grid{display:grid;width:100%;aspect-ratio:1;border:3px solid var(--line);background:var(--line)}
.cell{background:var(--cell);display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;color:#3b2f2a;
  border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);min-width:0;min-height:0;overflow:hidden;line-height:1}
.cell.br{border-right:3px solid var(--line)}.cell.bb{border-bottom:3px solid var(--line)}
.cell.user,.cell .user{color:var(--user)}
.cell.same{box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--accent) 22%,transparent)}
.cell.mark::after{content:"";position:absolute;inset:10%;border:3px solid #d07a2c;border-radius:50%;z-index:3;pointer-events:none}
.cell.miss{animation:shake .35s}.cell.miss .v,.cell.miss.v{color:var(--miss)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.cell.hinted{box-shadow:inset 0 0 0 3px #f2c94c;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 0 2px #f2c94c}to{box-shadow:inset 0 0 0 4px #f2c94c,0 0 10px #f2c94c}}
.ghost{color:var(--user);opacity:.3}
/* キラー */
.cage{position:absolute;inset:0;border:0 dashed #6b5848;pointer-events:none;z-index:1}
.sum{position:absolute;left:4%;top:3%;font-weight:700;color:#6b5848;z-index:3;background:inherit;padding:0 1px}
.cell .v{position:relative;z-index:2;padding-top:12%}
/* カックロ */
.grid.kak{gap:1px;border-width:3px}
.grid.kak .cell{border:none}
.cell.black{background:var(--black)}
.cell.black svg{position:absolute;inset:0;width:100%;height:100%}
.clue{position:absolute;font-weight:700;color:#fff}
.clue.a{right:7%;top:7%}.clue.d{left:7%;bottom:7%}
.clue.hl{color:#ffd76a}
.cell.run{background:color-mix(in srgb,var(--accent) 25%,var(--cell))}
/* ピラミッド */
.pyr{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.prow{display:flex;gap:4px;justify-content:center}
.pc{background:var(--cell);border:2.5px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;line-height:1;color:#3b2f2a}
.pc.given{background:color-mix(in srgb,var(--cell) 70%,#c8b48e)}
.pc.user{color:var(--user)}
.pc .rest{opacity:.3}
.pc.top{border-color:#d07a2c;border-width:3.5px}
.pc.miss{color:var(--miss);background:#fde3e0;animation:shake .35s}
.pc.hinted{box-shadow:0 0 0 3px #f2c94c;animation:glow2 1.2s ease-in-out infinite alternate}
@keyframes glow2{from{box-shadow:0 0 0 2px #f2c94c}to{box-shadow:0 0 0 4px #f2c94c,0 0 12px #f2c94c}}
/* 道具・数字ボタン */
.tools{display:flex;gap:10px;margin-top:10px}
.tool{padding:7px 16px;border-radius:20px;font-size:14px;font-weight:700}
#hintBtn{border:2px solid #d9a92a;background:#fff6c2;color:#3b2f2a}
#resetBtn{border:2px solid var(--main);background:var(--toolbg);color:var(--main)}
.tool:disabled{opacity:.4}
.pad{display:flex;gap:4px;width:min(92vw,440px);margin-top:10px}
.num{flex:1;aspect-ratio:.8;max-height:64px;border:none;border-radius:10px;background:var(--padbg);color:var(--padink);
  font-size:21px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.num small{font-size:9px;opacity:.75;font-weight:500}
.num.on{background:var(--accent);color:var(--accentInk);transform:translateY(-3px)}
.num:disabled{opacity:.35}
.pad.ten .num{font-size:19px;aspect-ratio:.72}
.rule{font-size:11.5px;opacity:.75;margin-top:10px;text-align:center;line-height:1.6;width:min(92vw,440px)}

/* ===== 扉 ===== */
#door-beyond{position:absolute;background:radial-gradient(ellipse at 50% 45%,#8a78b8 0%,#4a3d66 35%,#251d30 75%)}
#door-leafwrap{position:absolute;perspective:1200px}
#door-leaf{position:absolute;inset:0;transform-origin:0 50%;transition:transform 1.8s cubic-bezier(.5,0,.2,1)}
#door-leaf>img{position:absolute;inset:0;width:100%;height:100%}
#door-stage.open #door-leaf{transform:rotateY(80deg)}
#door-leaf::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.8s;pointer-events:none}
#door-stage.open #door-leaf::after{opacity:.55}
.mini{position:absolute;left:12%;right:12%;top:41.5%;height:17%;border-radius:10px;background:linear-gradient(#d8cdec,#a798c6 45%,#8a7cab);
  box-shadow:0 0 0 2px #5e5178,inset 0 2px 0 #fff9,0 5px 10px #000a;padding:5% 4%;display:flex}
.mini .in{flex:1;display:flex;gap:5%;background:#1e1728;border-radius:6px;padding:3% 4%;box-shadow:inset 0 3px 7px #000c}
.mini span{flex:1;border-radius:4px;background:linear-gradient(#a99fba,#f3eff8 30%,#f3eff8 70%,#a99fba);display:flex;align-items:center;justify-content:center;font-weight:700;color:#2b2238;font-size:min(5.5vw,26px)}
.mini.ok span{box-shadow:0 0 0 2px #e8c96a,0 0 8px #e8c96a}
.mini .tap{position:absolute;inset:-14px}
.mini.pulse{animation:mpulse 1.6s ease-in-out infinite}
@keyframes mpulse{50%{box-shadow:0 0 0 2px #5e5178,0 0 18px #e8c96a}}
#door-panel{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;background:linear-gradient(rgba(20,15,28,0),rgba(20,15,28,.85) 30%);display:flex;flex-direction:column;align-items:center;gap:7px}
#door-panel .digits .d{color:#e9e3f6}
#door-panel .digits .d b{border-color:#b9aad8;background:#2b2238;color:#f3dca6;width:46px;height:52px;font-size:26px}
.door-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.door-btns button{border:2px solid #b9aad8;background:rgba(26,20,36,.7);color:#ece6f6;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700}
.door-btns button.hint{border-color:#d9a92a;background:#fff6c2;color:#3b2f2a}
#door-msg{color:#f3dca6;font-size:13px;min-height:1.3em;text-align:center}
/* 大きなダイヤル */
#zoom{position:fixed;inset:0;background:rgba(20,15,28,.75);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px}
#zoom.show{display:flex}
#bigLock{width:min(88vw,380px);border-radius:16px;background:linear-gradient(#d8cdec,#a798c6 45%,#8a7cab);box-shadow:0 0 0 3px #5e5178,inset 0 2px 0 #fff9,0 10px 24px #000c;padding:16px 14px}
#bigLock.shake{animation:shake2 .4s}
@keyframes shake2{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#wheels{height:150px;display:flex;gap:5%;background:#1e1728;border-radius:8px;padding:8px 10px;box-shadow:inset 0 3px 7px #000c}
.wheel{position:relative;flex:1;overflow:hidden;border-radius:4px;background:linear-gradient(#a99fba,#f3eff8 30%,#f3eff8 70%,#a99fba);touch-action:none}
.wheel::after{content:"";position:absolute;left:0;right:0;top:33.33%;height:33.33%;border-top:1px solid #0003;border-bottom:1px solid #0003;pointer-events:none}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip div{display:flex;align-items:center;justify-content:center;font-weight:700;color:#2b2238}
.zb{border:none;border-radius:22px;background:#b9aad8;color:#2b2238;font-size:16px;font-weight:700;padding:11px 34px}
.zb.sub{background:transparent;color:#e9e3f6;border:2px solid #b9aad8}
#zmsg{color:#e9e3f6;font-size:14px;min-height:1.4em}
/* 絵を見る */
#viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;gap:10px}
#viewer.show{display:flex}
#viewer img{max-width:100vw;max-height:88vh}
#viewer .close{color:#fff;font-size:14px}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#fff,#d8ccef 40%,#8a78b8);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:30}
#flash.on{opacity:1}

/* ===== 隠し部屋 ===== */
#scr-hidden{background:#1a1424}
#h-stage{position:relative;width:min(100vw,520px);height:100%;overflow:hidden;background:#1a1424}
#rain{position:absolute;inset:0;width:100%;height:100%}
#h-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(26,20,36,.82) 0%,rgba(26,20,36,.55) 45%,rgba(26,20,36,0) 80%)}
.h-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 16px;transition:opacity .3s}
#h-stage.picking #h-main{opacity:0;pointer-events:none}
.h-sub{color:var(--h-main);font-size:13px;letter-spacing:.5em;margin-bottom:-4px}
#h-main h1{margin:0 0 18px;color:var(--h-ink);font-size:clamp(28px,9vw,42px);letter-spacing:.12em;text-shadow:0 0 12px #b9aad8aa,0 0 30px #8a78b866;text-align:center}
.hbtns{display:flex;flex-direction:column;gap:9px;width:min(80vw,300px)}
.hbtns button{border:2px solid var(--h-main);background:rgba(26,20,36,.7);color:var(--h-ink);border-radius:12px;padding:11px 0;font-size:15px;font-weight:700}
.hbtns button.main{background:var(--h-main);color:#251d30}
.hbtns button:disabled{opacity:.35}
.hbtns button.restart{margin-top:8px;border-style:dashed;color:var(--h-main);font-size:13px;padding:8px 0}
#h-pick{opacity:0;pointer-events:none;background:rgba(26,20,36,.78)}
#h-pick.show{opacity:1;pointer-events:auto}
#h-pick h2{margin:0 0 14px;color:var(--h-ink);font-size:clamp(24px,7vw,32px);letter-spacing:.08em;text-shadow:0 0 12px #b9aad8aa}
.label{color:var(--h-main);font-size:12px;letter-spacing:.3em;margin-top:6px}
#opRow{display:flex;flex-direction:column;align-items:center;gap:8px}
.ops{display:flex;gap:6px;width:min(84vw,320px)}

<script>
const SUDOKU=(()=>{

function dims(n){return n===4?[2,2]:n===6?[2,3]:[3,3];}
const unitCache={};
function makeUnits(n){
  if(unitCache[n])return unitCache[n];
  const [bh,bw]=dims(n),units=[];
  for(let r=0;r<n;r++){const u=[];for(let c=0;c<n;c++)u.push(r*n+c);units.push(u);}
  for(let c=0;c<n;c++){const u=[];for(let r=0;r<n;r++)u.push(r*n+c);units.push(u);}
  for(let br=0;br<n;br+=bh)for(let bc=0;bc<n;bc+=bw){const u=[];
    for(let r=br;r<br+bh;r++)for(let c=bc;c<bc+bw;c++)u.push(r*n+c);units.push(u);}
  const peers=[];
  for(let i=0;i<n*n;i++){const s=new Set();
    units.forEach(u=>{if(u.includes(i))u.forEach(j=>{if(j!==i)s.add(j)})});peers.push([...s]);}
  return unitCache[n]={units,peers};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fullGrid(n,peers){
  const g=new Array(n*n).fill(0),digits=[];for(let d=1;d<=n;d++)digits.push(d);
  function rec(i){if(i===n*n)return true;
    for(const d of shuffle(digits.slice())){if(peers[i].every(p=>g[p]!==d)){g[i]=d;if(rec(i+1))return true;g[i]=0;}}
    return false;}
  rec(0);return g;
}
// やさしい技（その数字しか入らないマス／そこにしか入らない数字）だけで解けるか調べる
// これで解ける＝答えは必ず1通り
function solveSingles(p,n,units,peers){
  const g=p.slice();let progress=true;
  while(progress){progress=false;const cand=[];
    for(let i=0;i<n*n;i++){if(g[i]){cand.push(null);continue;}
      const used=new Set(peers[i].map(j=>g[j])),c=[];
      for(let d=1;d<=n;d++)if(!used.has(d))c.push(d);
      if(!c.length)return null;cand.push(c);}
    for(let i=0;i<n*n;i++)if(!g[i]&&cand[i].length===1){g[i]=cand[i][0];progress=true;}
    if(progress)continue;
    for(const u of units)for(let d=1;d<=n;d++){
      if(u.some(i=>g[i]===d))continue;
      const pos=u.filter(i=>!g[i]&&cand[i].includes(d));
      if(!pos.length)return null;
      if(pos.length===1){g[pos[0]]=d;progress=true;}}
  }
  return g.every(v=>v)?g:null;
}
// いちばん見つけやすい技（このブロックでこの数字が入るのはここだけ）だけで解けるか
function solveBoxOnly(p,n,units,peers){
  const g=p.slice(),boxes=units.slice(2*n);let progress=true;
  while(progress){progress=false;
    for(const u of boxes)for(let d=1;d<=n;d++){
      if(u.some(i=>g[i]===d))continue;
      const pos=u.filter(i=>!g[i]&&peers[i].every(j=>g[j]!==d));
      if(!pos.length)return null;
      if(pos.length===1){g[pos[0]]=d;progress=true;}}
  }
  return g.every(v=>v)?g:null;
}
// mode: "story" = 物語 / "inf" = 無限
function generateSudoku(n,mode){
  const {units,peers}=makeUnits(n);
  let solver=solveSingles,minGivens=0;
  if(n===9&&mode==="story"){solver=solveBoxOnly;minGivens=32+Math.floor(Math.random()*4);} // 32〜35個
  if(n===9&&mode==="inf"){minGivens=30+Math.floor(Math.random()*4);}                       // 30〜33個
  if(n===6&&mode==="story"){minGivens=14+Math.floor(Math.random()*3);}                     // 14〜16個
  // むずかしい(hard)：最初の試作版と同じ（やさしい技だけで解ける範囲で、数字をできるだけ減らす）
  for(let tries=0;tries<50;tries++){
    const sol=fullGrid(n,peers),puz=sol.slice();
    for(const i of shuffle([...Array(n*n).keys()])){
      if(puz.filter(v=>v).length<=minGivens)break;
      const v=puz[i];puz[i]=0;if(!solver(puz,n,units,peers))puz[i]=v;}
    return{puzzle:puz,solution:sol};
  }
}
// ヒント：今の盤面で答えが決まるマスを探す（印のマスは除く）
function findHint(g,n,units,peers,exclude){
  const free=i=>!g[i]&&i!==exclude;
  const order=units.slice(2*n).concat(units.slice(0,2*n)); // ブロック優先
  for(const u of order)for(let d=1;d<=n;d++){
    if(u.some(i=>g[i]===d))continue;
    const pos=u.filter(i=>!g[i]&&peers[i].every(j=>g[j]!==d));
    if(pos.length===1&&free(pos[0]))return pos[0];}
  for(let i=0;i<n*n;i++){if(!free(i))continue;
    const used=new Set(peers[i].map(j=>g[j]));let c=0;
    for(let d=1;d<=n;d++)if(!used.has(d))c++;
    if(c===1)return i;}
  for(let i=0;i<n*n;i++)if(free(i))return i;
  return -1;
}
// 丸を置く場所：やさしい技で解く手順を再現し、何段階目で答えが決まるかを全マスで調べる
function waveOrder(p,n,units,peers,boxOnly){
  const g=p.slice(),wave=new Array(n*n).fill(0);let w=0;
  for(;;){w++;const found=new Map();
    for(const u of boxOnly?units.slice(2*n):units)for(let d=1;d<=n;d++){
      if(u.some(i=>g[i]===d))continue;
      const pos=u.filter(i=>!g[i]&&peers[i].every(j=>g[j]!==d));
      if(pos.length===1)found.set(pos[0],d);}
    if(!boxOnly)for(let i=0;i<n*n;i++){if(g[i]||found.has(i))continue;
      const used=new Set(peers[i].map(j=>g[j])),c=[];for(let d=1;d<=n;d++)if(!used.has(d))c.push(d);
      if(c.length===1)found.set(i,c[0]);}
    if(!found.size)break;
    for(const [i,d] of found){g[i]=d;wave[i]=w;}
  }
  return wave;
}
// 終盤（全体の7割より後の段階）に決まるマスから選ぶ
function pickMark(wave,puzzle){
  const e=puzzle.map((v,i)=>v?-1:i).filter(i=>i>=0).sort((a,b)=>wave[b]-wave[a]);
  const max=Math.max(...e.map(i=>wave[i])),late=e.filter(i=>wave[i]>=Math.max(2,Math.ceil(max*0.7))); // 全体の7割より後の段階
  const top=late.length?late:e.slice(0,Math.max(1,Math.ceil(e.length/4)));
  return top[Math.floor(Math.random()*top.length)];
}

return {generate:generateSudoku,findHint,makeUnits,dims,waveOrder,pickMark};
})();
const KILLER=(()=>{

function dims(n){return n===4?[2,2]:n===6?[2,3]:[3,3];}
const unitCache={};
function makeUnits(n){
  if(unitCache[n])return unitCache[n];

  for(let r=0;r<n;r++){const u=[];for(let c=0;c<n;c++)u.push(r*n+c);units.push(u);}
  for(let c=0;c<n;c++){const u=[];for(let r=0;r<n;r++)u.push(r*n+c);units.push(u);}
  for(let br=0;br<n;br+=bh)for(let bc=0;bc<n;bc+=bw){const u=[];
    for(let r=br;r<br+bh;r++)for(let c=bc;c<bc+bw;c++)u.push(r*n+c);units.push(u);}
  const peers=[];
  for(let i=0;i<n*n;i++){const s=new Set();
    units.forEach(u=>{if(u.includes(i))u.forEach(j=>{if(j!==i)s.add(j)})});peers.push([...s]);}
  return unitCache[n]={units,peers};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fullGrid(n,peers){

    for(const d of bias()){if(runOf[i].some(ri=>runs[ri].cells.some(x=>g[x]===d)))continue;
      g[i]=d;if(rec(k+1))return true;g[i]=0;}return false;}

      if(f.empty.length===1&&f.s>=1&&f.s<=9)found.set(f.empty[0],f.s);
      for(let d=1;d<=9;d++)if(f.I>>d&1){const pos=f.empty.filter(x=>cand[x]>>d&1);if(pos.length===1)found.set(pos[0],d);}});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// L段のピラミッド。r=0が1段目（一番下）、r=L-1が頂上。セル番号は下の段から左→右
function pyrLayout(L){
  const id=[],pos=[];let k=0;
  for(let r=0;r<L;r++){id.push([]);for(let c=0;c<L-r;c++){id[r].push(k);pos.push([r,c]);k++;}}
  const tris=[];for(let r=1;r<L;r++)for(let c=0;c<L-r;c++)tris.push({t:id[r][c],a:id[r-1][c],b:id[r-1][c+1]});
  return{id,pos,tris,count:k,bottom:id[0]};
}
const calc=(op,a,b)=>op==="add"?a+b:Math.abs(a-b);
function buildSolution(L,op){
  const lay=pyrLayout(L),v=new Array(lay.count);
  shuffle([1,2,3,4,5,6,7,8,9]).slice(0,L).forEach((d,c)=>v[lay.id[0][c]]=d);
  for(const T of lay.tris)v[T.t]=calc(op,v[T.a],v[T.b]); // tris は下の段から順に並んでいる

// メモなしの直接計算だけで解き進める（1段階ずつ）
//  ・下の2つが分かる → 上が分かる
//  ・上と下の片方が分かる → もう片方が分かる（引き算は「＋」と「−」の2通りのうち、1〜9の範囲や
//    1段目の「全部違う数字」に合うのが1つだけのとき）
function solveDirect(g0,lay,op){
  const g=g0.slice(),wave=new Array(lay.count).fill(0),isBottom=new Set(lay.bottom);let w=0;
  const okVal=(i,x)=>{if(isBottom.has(i))return x>=1&&x<=9&&!lay.bottom.some(j=>j!==i&&g[j]===x);return x>=0&&(op==="add"||x<=9);};
  for(;;){w++;const found=new Map();
    for(const T of lay.tris){const a=g[T.a],b=g[T.b],t=g[T.t];
      if(a!=null&&b!=null&&t==null)found.set(T.t,calc(op,a,b));
      for(const [x,y] of [[T.a,T.b],[T.b,T.a]]){ // x が分かっていて y を求める
        if(g[x]==null||g[y]!=null||t==null)continue;

        if(opts.length===1)found.set(y,opts[0]);}}

// むずかしい用：候補の集まりを持って、つじつまが合わない数を消していく（先読みが必要な推理）
function solveSets(g0,lay,op){
  const L=lay.id.length,isBottom=new Set(lay.bottom),cand=[];
  for(let i=0;i<lay.count;i++){const r=lay.pos[i][0];
    if(g0[i]!=null){cand.push(new Set([g0[i]]));continue;}
    const s=new Set();const hi=isBottom.has(i)?9:(op==="add"?9*(1<<r)+8*(1<<r):9);
    for(let x=isBottom.has(i)?1:0;x<=hi;x++)s.add(x);cand.push(s);}

  while(ch){ch=false;
    for(const T of lay.tris){const A=cand[T.a],B=cand[T.b],C=cand[T.t];
      const nA=new Set(),nB=new Set(),nC=new Set();

function directSteps(g0,lay,op,maxWaves){ // 戻り値：null＝矛盾、それ以外は進めた盤面

    for(const [i,x] of found){if(g[i]!=null&&g[i]!==x)return null;g[i]=x;}

function solveHard(g0,lay,op){
  let g=g0.slice();const isBottom=new Set(lay.bottom);

    let progress=false;
    for(const T of lay.tris){if(g[T.t]==null)continue;
      for(const [x,y] of [[T.a,T.b],[T.b,T.a]]){
        if(g[x]==null||g[y]!=null)continue;
        const opts=(op==="add"?[g[T.t]-g[x]]:[g[x]+g[T.t],g[x]-g[T.t]]).filter((z,k,arr)=>arr.indexOf(z)===k&&z>=(isBottom.has(y)?1:0)&&(isBottom.has(y)?z<=9:(op==="add"||z<=9)));

        if(alive.length===1){g[y]=alive[0];progress=true;break;}}

function generatePyramid(L,op,mode){
  const lay=pyrLayout(L),top=lay.count-1;
  for(;;){
    const sol=buildSolution(L,op);
    if(mode==="story"&&op==="sub"&&sol[top]===0)continue; // ダイヤル錠用：頂上は1〜9
    // 見せる数字の選び方：物語＝下の段から、むずかしい＝上の段から、無限＝ばらばら
    const order=[...Array(lay.count).keys()].map(i=>{const r=lay.pos[i][0],j=Math.random();
      return[i,mode==="hard"?(L-r)+j*1.5:j];}).sort((a,b)=>a[1]-b[1]).map(x=>x[0])

    const solver=mode==="hard"?(g=>solveHard(g,lay,op).solved):(g=>solveDirect(g,lay,op).solved);

    for(const i of shuffle([...Array(lay.count).keys()])){if(puz[i]==null)continue;const v=puz[i];puz[i]=null;if(!solver(puz))puz[i]=v;}

function findHint(g,lay,op,exclude){
  const r=solveDirect(g,lay,op);

  const isBottom=new Set(lay.bottom);
  for(const T of lay.tris){if(g[T.t]==null)continue;
    for(const [x,y] of [[T.a,T.b],[T.b,T.a]]){

      const alive=opts.filter(v=>{const h=g.slice();h[y]=v;return directSteps(h,lay,op,2)!==null;});

  for(let i=0;i<g.length;i++)if(g[i]==null&&i!==exclude)return i;
  return -1;

async function toArrayBuffer(u){

    if(!b||!ac||ac.state!=="running"){setTimeout(()=>sfxFallback(name),(delay||0)*1000);return;}
    const src=ac.createBufferSource();src.buffer=b;src.connect(ac.destination);src.start(ac.currentTime+(delay||0));}catch(e){sfxFallback(name);}}

// 曲の終わりは音が小さくなって終わるので、小さくなりきる2秒前から次の頭を重ねて始める（loop＝次を始める秒数）
const BGM_VOL=1;          // BGM全体の大きさ（効果音とのバランス）
const BGM_FADE=1;         // 画面が変わって曲が入れ替わる時の秒数
const bgmBuf={},bgmLoad={};let bgmWant=null,bgmCur=null,bgmGain=null,bgmSrcs=[],bgmTimer=0;
function screenTrack(id){return id==="scr-puzzle"?"puzzle":id==="scr-hidden"?"hidden":"story";}
function bgmGet(name){
  if(bgmBuf[name])return Promise.resolve(bgmBuf[name]);
  if(!bgmLoad[name])bgmLoad[name]=toArrayBuffer(BGM[name].src).then(a=>new Promise((ok,ng)=>ac.decodeAudioData(a,ok,ng))).then(b=>{
    // 覚えておくのは2曲まで（スマホのメモリ節約）：今かかっている曲と、今回の曲以外は捨てる
    Object.keys(bgmBuf).forEach(k=>{if(k!==bgmCur&&k!==name)delete bgmBuf[k];delete bgmLoad[k];});
    bgmBuf[name]=b;return b;}).catch(e=>{delete bgmLoad[name];throw e;});
  return bgmLoad[name];}
function bgmStop(fade){clearTimeout(bgmTimer);bgmCur=null;if(!bgmGain)return;
  const g=bgmGain,srcs=bgmSrcs;bgmGain=null;bgmSrcs=[];
  try{const t=ac.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+fade);
    srcs.forEach(s=>{try{s.stop(t+fade+.05);}catch(e){}});}catch(e){}}
// 1回分を鳴らして、終わり際に次の1回を予約する
function bgmPlayAt(name,buf,when,g){
  const s=ac.createBufferSource();s.buffer=buf;s.connect(g);s.start(when);bgmSrcs.push(s);
  s.onended=()=>{bgmSrcs=bgmSrcs.filter(x=>x!==s);};
  const next=when+BGM[name].loop;
  bgmTimer=setTimeout(()=>{if(bgmGain===g)bgmPlayAt(name,buf,next,g);},Math.max(0,(next-ac.currentTime-1.5)*1000));}
function bgmApply(){
  const name=bgmWant;
  if(!name||SAVE.bgm===false||!BGM[name]||!ac||ac.state!=="running")return;
  if(bgmCur===name)return;
  bgmStop(BGM_FADE);bgmCur=name;
  bgmGet(name).then(buf=>{if(bgmCur!==name||bgmGain)return;
    const g=ac.createGain();g.connect(ac.destination);const t=ac.currentTime+.05;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(BGM_VOL,t+BGM_FADE*.6);bgmGain=g;bgmPlayAt(name,buf,t,g);
  }).catch(()=>{if(bgmCur===name)bgmCur=null;});}
function bgmSet(id){bgmWant=screenTrack(id);bgmApply();}
// スマホで画面を閉じたり他のアプリに移った時は、音を止めておく
document.addEventListener("visibilitychange",()=>{if(!ac)return;if(document.hidden)ac.suspend().catch(()=>{});else ac.resume().then(bgmApply).catch(()=>{});});

let P=null,selected=null,focusRun=-1;
const limit=()=>P.mode==="story"||P.mode==="challenge"?5:3, hintLimit=()=>P.mode==="story"||P.mode==="challenge"?3:1;
const KPAL=["#fde8e4","#e3f0fb","#e8f5e1","#fff3d6","#efe6f7","#e0f4f1"];
function clone(o){return JSON.parse(JSON.stringify(o));}
function startPuzzle(ctx){
  let type,size,mode,op=null,data,mark=-1;
  if(ctx.from==="story"){
    [type,size]=STEPS[ctx.step];mode="story";
    const key=type+"-"+size,idx=SAVE.setUse[key]||0;SAVE.setUse[key]=idx+1;
    if(SETS[key]&&idx<SETS[key].length){data=clone(SETS[key][idx]);if(data.mark!=null)mark=data.mark;}
    else data=generate(type,size,"story");
    if(type==="pyramid")op=data.op;
    if(mark<0&&size===9)mark=computeMark(type,data);
    if(type==="pyramid"&&size===5)mark=data.puzzle.length-1;
  }else{
    type=ctx.type;mode=ctx.mode;size=type==="pyramid"?5:9;
    if(type==="pyramid")op=ctx.op==="rand"?(Math.random()<.5?"add":"sub"):ctx.op;
    data=generate(type,size,mode,op);
  }
  if(type==="killer")data.colors=colorCages(size,data.cages,data.cageOf);
  P={type,size,mode,op,from:ctx.from,step:ctx.step,ctxOp:ctx.op,data,board:data.puzzle.slice(),partial:{},misses:0,hints:0,hintCell:-1,mark,done:false};
  if(ctx.from==="story"){SAVE.storyPuzzle=P;SAVE.story.phase="puzzle";SAVE.last="story";}else{SAVE.infPuzzle=P;SAVE.last="inf";}
  save();openPuzzle(P);
}
function generate(type,size,mode,op){
  if(type==="sudoku"){const g=SUDOKU.generate(size,mode);return{puzzle:g.puzzle,solution:g.solution};}
  if(type==="killer"){const g=KILLER.generate(size,mode);return{puzzle:g.puzzle,solution:g.solution,cages:g.cages,cageOf:g.cageOf};}
  if(type==="kakuro"){const g=KAKURO.generate(size,mode);return{W:g.W,runs:g.runs,runOf:g.runOf,puzzle:g.puzzle,solution:g.solution};}
  if(type==="pyramid"){op=op||(size===5?"sub":"add");const g=PYRAMID.generate(size,op,mode);return{L:size,op,puzzle:g.puzzle,solution:g.solution};}
}
function computeMark(type,d){
  if(type==="sudoku"){const {units,peers}=SUDOKU.makeUnits(9);return SUDOKU.pickMark(SUDOKU.waveOrder(d.puzzle,9,units,peers,true),d.puzzle);}
  if(type==="killer"){const {units,peers}=KILLER.makeUnits(9);return KILLER.pickMark(KILLER.waveOrder(d.puzzle,9,units,peers,d.cages,d.cageOf),d.puzzle);}
  if(type==="kakuro")return KAKURO.pickMark(KAKURO.solveWaves(d.puzzle,9,d.W,d.runs,d.runOf).wave,d.W,d.puzzle);
  return -1;
}
function colorCages(n,cages,cageOf){const col=new Array(cages.length).fill(-1);
  cages.forEach((cg,k)=>{const used=new Set();cg.cells.forEach(i=>KILLER.nbrs(i,n).forEach(b=>{if(cageOf[b]!==k)used.add(col[cageOf[b]])}));
    let c=Math.floor(Math.random()*KPAL.length);for(let t=0;t<KPAL.length&&used.has(c);t++)c=(c+1)%KPAL.length;col[k]=c;});return col;}
function openPuzzle(p){

  const size=`min(calc((${W_()} - 16px) / 5), 84px)`,big=Math.max(...d.solution.map(x=>String(x).length));

    for(const i of lay.id[r]){const c=document.createElement("div");c.className="pc";c.dataset.i=i;
      c.style.width=size;c.style.height=`calc(${size} * 0.72)`;c.style.fontSize=`calc(${size} * ${big>=3?0.36:0.44})`;
      if(d.puzzle[i]!=null){c.classList.add("given");c.textContent=d.puzzle[i];}
      else if(P.board[i]!=null){c.classList.add("user");c.textContent=P.board[i];}
      else if(P.partial[i]){c.classList.add("user");const a=String(d.solution[i]);c.innerHTML=`${P.partial[i]}<span class="rest">${"_".repeat(a.length-P.partial[i].length)}</span>`;}
      else if(i===P.hintCell){c.classList.add("hinted");c.innerHTML=`<span class="ghost">${d.solution[i]}</span>`;}
      if(i===P.mark)c.classList.add("top");
      c.onclick=()=>tapCell(i);row.appendChild(c);}
    box.appendChild(row);}
  b.appendChild(box);
}
function renderPad(){
  const pad=$("#pad");pad.innerHTML="";pad.className="pad";
  let keys;if(P.type==="pyramid"){keys=[1,2,3,4,5,6,7,8,9,0];pad.classList.add("ten");}
  else if(P.type==="kakuro")keys=[1,2,3,4,5,6,7,8,9];else keys=[...Array(P.size).keys()].map(k=>k+1);
  for(const k of keys){const b=document.createElement("button");b.className="num"+(k===selected?" on":"");
    if(P.type==="sudoku"||P.type==="killer"){const left=P.size-P.board.filter(v=>v===k).length;b.innerHTML=`${k}<small>のこり${left}</small>`;b.disabled=left===0||P.done;}
    else{b.textContent=k;b.disabled=P.done;}
    b.onclick=()=>{selected=k;render();};pad.appendChild(b);}
}
function tapCell(i){
  if(P.done)return;
  const t=P.type,d=P.data;
  if(t==="sudoku"||t==="killer"){if(P.board[i]){selected=P.board[i];render();return;}}
  if(!empty(i))return;
  if(selected==null)return;
  if(t==="pyramid"){
    const ans=String(d.solution[i]),str=(P.partial[i]||"")+selected;
    if(str.length<ans.length){P.partial[i]=str;save();render();sfx("digit_partial");return;}   // 途中の桁：合っているかはまだ言わない音
    delete P.partial[i];
    if(str!==ans&&P.mode==="story"&&pyrUndecided(i,+str)){render();sfx("undecided");toast("このマスはまだ決められないよ。<br>一番下の段の、ほかのマスから埋めてみよう");return;}
    check(i,str===ans,str);return;}
  check(i,d.solution[i]===selected,selected);
}
// ピラミッド：今わかっている数字だけでは、入れた数字もまちがいとは言えない（まだ決められないマス）か
function pyrUndecided(i,v){
  const d=P.data,lay=PYRAMID.pyrLayout(d.L),g=k=>d.puzzle[k]!=null?d.puzzle[k]:P.board[k],op=d.op,bottom=lay.bottom;
  if(bottom.includes(i)){if(v<1||v>9)return false;if(bottom.some(k=>k!==i&&g(k)===v))return false;}
  let checked=0;
  for(const T of lay.tris){if(![T.a,T.b,T.t].includes(i))continue;
    const val=k=>k===i?v:g(k);const a=val(T.a),b=val(T.b),t=val(T.t);
    if(a==null||b==null||t==null)continue;checked++;
    if((op==="add"?a+b:Math.abs(a-b))!==t)return false;}
  return checked>0;
}
let toastT=null;function toast(html){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.innerHTML=html;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800);}
function check(i,ok,shown){
  if(ok){P.board[i]=P.data.solution[i];
    if((P.type==="sudoku"||P.type==="killer")&&P.board.filter(x=>x===selected).length===P.size)selected=null;
    sfx("number_correct");save();render();
    if(isComplete())setTimeout(cleared,250);
  }else{P.misses++;save();render();sfx(P.misses>=limit()?"mistake_limit":"number_mistake");
    const el=P.type==="pyramid"?document.querySelector(`.pc[data-i="${i}"]`):$("#board").querySelector(".grid").children[i];
    if(el){el.classList.add("miss");if(P.type==="pyramid")el.textContent=shown;else{const v=el.querySelector(".v");if(v){v.classList.remove("ghost");v.textContent=shown;}else el.textContent=shown;}}
    setTimeout(()=>{render();if(P.misses>=limit())over();},450);}
}
function isComplete(){return P.type==="kakuro"?P.data.W.every((w,k)=>!w||P.board[k]===P.data.solution[k]):P.board.every((x,k)=>x===P.data.solution[k]);}
function cleared(){
  P.done=true;save();render();
  if(P.from==="story"){
    let t="クリア！";
    const before=STEPS.map((_,i)=>canPlay(i));
    if(P.size===DIGIT_SIZE[P.type]){const dgt=P.data.solution[P.mark];SAVE.story.got.push(dgt);sfx("code_acquired",.95);
      t+=`<br>${P.type==="pyramid"?"頂上":"◯のマス"}の数字は<br><span class="big">${dgt}</span><br><small>メモに書きとめた</small>`;}
    SAVE.story.cleared[P.step]=true;SAVE.storyPuzzle=null;delete (SAVE.storyPaused||{})[P.step];SAVE.story.phase="memo";
    const all=SAVE.story.cleared.every(x=>x);if(all)SAVE.story.phase="ending",SAVE.story.scene=0;
    SAVE.story.justUnlocked=STEPS.map((_,i)=>i).filter(i=>!before[i]&&canPlay(i));   // 新しく押せるようになった5段・9×9
    save();sfx("puzzle_clear");
    dialog(t,[["次へ",all?()=>playEnding(0):showMemo]]);
  }else{
    SAVE.infPuzzle=null;save();sfx("puzzle_clear");
    const ctx={from:"inf",type:P.type,mode:P.mode,op:P.ctxOp};
    dialog("クリア！",[["次の問題",()=>startPuzzle(ctx)],["隠し部屋へもどる",()=>showHidden(false),"sub"]]);
  }
}
function restartP(){P.board=P.data.puzzle.slice();P.partial={};P.misses=0;P.hints=0;P.hintCell=-1;P.done=false;selected=null;focusRun=-1;save();}
function over(){dialog(`ミスが${limit()}回になりました`,[["この問題を最初からやり直す",()=>{restartP();render();}],["タイトルへ戻る",()=>{restartP();goTitle();},"sub"]]);}
$("#hintBtn").onclick=()=>{
  if(P.done||P.hints>=hintLimit()||(P.hintCell>=0&&empty(P.hintCell)))return;
  const d=P.data;let i=-1;
  if(P.type==="sudoku"){const {units,peers}=SUDOKU.makeUnits(P.size);i=SUDOKU.findHint(P.board,P.size,units,peers,P.mark);}
  else if(P.type==="killer")i=KILLER.findHint(P.board,P.size,d.cages,P.mark);
  else if(P.type==="kakuro")i=KAKURO.findHint(P.board,P.size,d.W,d.runs,d.runOf,P.mark);
  else i=PYRAMID.findHint(P.board,PYRAMID.pyrLayout(d.L),d.op,P.mark);
  if(i<0)return;delete P.partial[i];P.hints++;P.hintCell=i;save();render();sfx("hint_used");
};
$("#resetBtn").onclick=()=>{if(P.done)return;dialog("この盤面を最初からやり直しますか？<br><small>ミスとヒントの回数も元に戻ります</small>",[["やり直す",()=>{restartP();render();}],["やめる",null,"sub"]]);};
$("#pz-help").onclick=()=>{const r=P.type==="pyramid"?RULES[P.op]:RULES[P.type];
  dialog(`<b>${P.type==="pyramid"?NAMES[P.type]+"（"+(P.op==="add"?"足し算":"引き算")+"）":NAMES[P.type]}の遊び方</b><br><span style="font-size:14px;display:block;text-align:left;margin-top:8px">${r}<br><br>・数字ボタンをタップしてから、入れたいマスをタップします<br>・まちがえるとミスになります（${limit()}回まで）<br>・💡ヒントで、答えが決まるマスが光ります（${hintLimit()}回まで）</span>`,[["とじる",null]]);};
// 戻るボタン（どちらで戻っても、遊んでいた盤面は保存される）
function leavePuzzle(){if(P.from==="story"){SAVE.storyPaused=SAVE.storyPaused||{};SAVE.storyPaused[P.step]=P;}save();}
$("#pz-back1").onclick=()=>{leavePuzzle();if(P.from==="story")showMemo();else{showHidden(false);openPick(P.type);}};
$("#pz-back2").onclick=()=>{leavePuzzle();if(P.from==="story")goTitle();else showHidden(false);};

/* ================= 扉 ================= */
const N10=10,val=[0,0,0,0],strips=[];let cellH=40;
function showDoor(){
  show("scr-door");SAVE.story.phase="door";SAVE.last="story";save();
  const st=$("#door-stage");st.classList.remove("open");$("#door-bg").src=IMG.door;$("#door-leafimg").src=IMG.door_leaf;
  const L=LAYOUT.leaf;for(const id of ["#door-beyond","#door-leafwrap"])Object.assign($(id).style,{left:L[0]+"%",top:L[1]+"%",width:L[2]+"%",height:L[3]+"%"});
  $("#door-digits").innerHTML=digitsHTML();$("#mini").classList.add("pulse");$("#mini").classList.remove("ok");
  $("#door-msg").textContent="錠をタップして、番号を合わせよう";renderDoorBtns();
}
function renderDoorBtns(){
  const w=$("#door-btns");w.innerHTML="";
  const add=(t,fn,cls)=>{const b=document.createElement("button");b.textContent=t;if(cls)b.className=cls;b.onclick=fn;w.appendChild(b);};
  add("本棚を見る",()=>view(IMG.shelf));add("机を見る",()=>view(IMG.desk));add("部屋を見る",()=>view(IMG.room));
  const h=SAVE.story.hints||0;
  if(h<DOOR_HINTS.length)add(`💡 ヒント${h+1}`,()=>{SAVE.story.hints=h+1;save();$("#door-msg").textContent=DOOR_HINTS[h];renderDoorBtns();},"hint");
  else add("💡 ヒントをもう一度見る",()=>{$("#door-msg").textContent=DOOR_HINTS.join("　");},"hint");
  if(h>0)$("#door-msg").textContent=DOOR_HINTS[h-1];
}
// 扉が開いた後のセリフ（タップで次へ）
const DOOR_END=["扉が開いた……！","博士が消えていたのは、この隠し部屋に入っていたからだったんだ！"];
function doorLine(k){
  const w=$("#door-win"),tx=$("#door-wtext");w.style.display="block";w.classList.remove("done");let p=0;const t=DOOR_END[k];tx.textContent="";
  clearInterval(typeTimer);typing=true;typeTimer=setInterval(()=>{tx.textContent=t.slice(0,++p);if(p>=t.length){clearInterval(typeTimer);typing=false;w.classList.add("done");}},TEXT_SPEED);
  sfx("narration_appear",.05);
  w.onclick=()=>{if(typing){clearInterval(typeTimer);typing=false;tx.textContent=t;w.classList.add("done");return;}
      if(k<DOOR_END.length-1){doorLine(k+1);return;}
    w.onclick=null;$("#flash").classList.add("on");sfx("hidden_room_magic",.1);
    setTimeout(()=>{w.style.display="none";$("#door-panel").style.opacity=1;SAVE.unlocked=true;SAVE.story.phase="done";SAVE.last="story";save();showHidden(true);$("#flash").classList.remove("on");},1300);};
}
function view(src){$("#viewer-img").src=src;$("#viewer").classList.add("show");}
$("#viewer").onclick=()=>$("#viewer").classList.remove("show");
function layoutWheels(){const w=$("#wheels .wheel");if(!w)return;cellH=w.clientHeight/3;
  strips.forEach((s,k)=>{s.querySelectorAll("div").forEach(d=>{d.style.height=cellH+"px";d.style.fontSize=(cellH*.72)+"px";});place(k,false);});}
function place(k,anim){const s=strips[k];s.style.transition=anim?"transform .25s cubic-bezier(.2,.8,.3,1.2)":"none";s.style.transform=`translateY(${-(N10+val[k])*cellH+cellH}px)`;}
function setWheel(k,v,click){if(click!==false&&v!==val[k])sfx("dial_click");val[k]=v;place(k,true);document.querySelectorAll("#mini span")[k].textContent=v;}
(function buildWheels(){const we=$("#wheels");
  for(let k=0;k<4;k++){const w=document.createElement("div");w.className="wheel";const s=document.createElement("div");s.className="strip";
    for(let r=0;r<3;r++)for(let d=0;d<N10;d++){const c=document.createElement("div");c.textContent=d;s.appendChild(c);}
    w.appendChild(s);we.appendChild(w);strips.push(s);
    let sy=0,so=0,drag=false,ly=0,lt=0,vel=0;
    w.addEventListener("pointerdown",e=>{drag=true;w.setPointerCapture(e.pointerId);sy=ly=e.clientY;lt=performance.now();vel=0;so=-(N10+val[k])*cellH+cellH;s.style.transition="none";});
    let tickV=0;
    w.addEventListener("pointermove",e=>{if(!drag)return;const n=performance.now();vel=(e.clientY-ly)/Math.max(1,n-lt);ly=e.clientY;lt=n;s.style.transform=`translateY(${so+(e.clientY-sy)}px)`;
      const cur=((val[k]-Math.round((e.clientY-sy)/cellH))%N10+N10)%N10;if(cur!==tickV){tickV=cur;sfx("dial_click");}});   // 目盛りを1つ動かすたびに
    w.addEventListener("pointerdown",()=>{tickV=val[k];},true);
    const end=e=>{if(!drag)return;drag=false;const still=performance.now()-lt>80;const moved=(e.clientY-sy)+(still?0:vel*90);
      const v=((val[k]-Math.round(moved/cellH))%N10+N10)%N10;if(v!==tickV)sfx("dial_click");setWheel(k,v,false);};
    w.addEventListener("pointerup",end);w.addEventListener("pointercancel",end);}
  window.addEventListener("resize",layoutWheels);
})();
$("#mini-tap").onclick=()=>{if($("#door-stage").classList.contains("open"))return;$("#zoom").classList.add("show");$("#zmsg").textContent="";setTimeout(layoutWheels,0);};
$("#closeBtn").onclick=()=>$("#zoom").classList.remove("show");
$("#okBtn").onclick=()=>{
  const ans=SAVE.story.got.slice().sort((a,b)=>a-b);
  if(val.every((v,i)=>v===ans[i])){
    $("#zoom").classList.remove("show");$("#mini").classList.remove("pulse");$("#mini").classList.add("ok");$("#door-msg").textContent="カチッ……";sfx("lock_unlock");
    setTimeout(()=>{$("#door-stage").classList.add("open");sfx("door_creak");$("#door-msg").textContent="扉が開いた！";},800);
    setTimeout(()=>{$("#door-panel").style.opacity=0;doorLine(0);},2700);
  }else{const b=$("#bigLock");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("#zmsg").textContent="開かない……";sfx("lock_denied");}
};

/* ================= 隠し部屋 ================= */
const cv=$("#rain"),ctx2=cv.getContext("2d");let RW,RH,rsize,drops=[],rafId=0;const dpr=Math.min(2,window.devicePixelRatio||1);
const RP={head:"#f4efff",body:[185,170,216],extra:[[76,156,196],[208,96,44]]};
function rainResize(){const r=cv.getBoundingClientRect();RW=r.width;RH=r.height;cv.width=RW*dpr;cv.height=RH*dpr;ctx2.setTransform(dpr,0,0,dpr,0,0);
  rsize=Math.max(14,Math.round(RW/22));drops=[];for(let i=0;i<Math.ceil(RW/rsize);i++)drops.push(newDrop(i,true));}
function newDrop(i,init){return{x:i*rsize+rsize/2,y:init?Math.random()*RH*1.2-RH*.4:-Math.random()*RH*.6,speed:(.6+Math.random()*1.4)*rsize/16,
  len:8+Math.floor(Math.random()*16),digits:Array.from({length:30},()=>Math.floor(Math.random()*10)),t:0,tint:Math.random()<.18?Math.floor(Math.random()*2):-1};}
function rainFrame(){ctx2.fillStyle="#1a1424";ctx2.fillRect(0,0,RW,RH);ctx2.font=`bold ${rsize*.82}px "Courier New",monospace`;ctx2.textAlign="center";ctx2.textBaseline="middle";
  for(let i=0;i<drops.length;i++){const d=drops[i];d.y+=d.speed;d.t++;if(d.t%6===0)d.digits[Math.floor(Math.random()*30)]=Math.floor(Math.random()*10);
    for(let k=0;k<d.len;k++){const y=d.y-k*rsize;if(y<-rsize||y>RH+rsize)continue;const f=1-k/d.len;
      if(k===0){ctx2.fillStyle=RP.head;ctx2.shadowColor=RP.head;ctx2.shadowBlur=8;}else{const c=d.tint>=0?RP.extra[d.tint]:RP.body;ctx2.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${(f*.85).toFixed(3)})`;ctx2.shadowBlur=0;}
      ctx2.fillText(d.digits[k%30],d.x,y);}
    ctx2.shadowBlur=0;if(d.y-d.len*rsize>RH)drops[i]=newDrop(i,false);}
  rafId=requestAnimationFrame(rainFrame);}
function startRain(){if(rafId)return;rainResize();rainFrame();}
function stopRain(){cancelAnimationFrame(rafId);rafId=0;}
window.addEventListener("resize",()=>{if(rafId)rainResize();});
function showHidden(enter){
  show("scr-hidden");startRain();closePick();
  const can=(SAVE.last==="inf"&&SAVE.infPuzzle)||(SAVE.last==="story"&&["intro","memo","puzzle","ending","door"].includes(SAVE.story.phase))||SAVE.infPuzzle;
  $("#h-cont").disabled=!can;
  if(enter){const e=$("#h-enter");e.classList.add("on");void e.offsetWidth;setTimeout(()=>e.classList.remove("on"),50);}
}
$("#h-cont").onclick=()=>{
  if(SAVE.last==="inf"&&SAVE.infPuzzle)openPuzzle(SAVE.infPuzzle);
  else if(SAVE.last==="story"&&SAVE.story.phase!=="done"&&SAVE.story.phase!=="none")resumeStory();
  else if(SAVE.infPuzzle)openPuzzle(SAVE.infPuzzle);
};
$("#h-restart").onclick=()=>dialog("物語を最初からやり直しますか？<br><small>隠し部屋はそのまま遊べます</small>",[["最初から",startStory],["やめる",null,"sub"]]);
let pickType=null;
function openPick(type){pickType=type;$("#h-pickTitle").textContent=NAMES[pickType];
  $("#opRow").style.display=pickType==="pyramid"?"":"none";
  $(".mode.chal").style.display=pickType==="killer"?"":"none";   // チャレンジは星蝕封印の回廊だけ
  document.querySelectorAll(".ops button").forEach(x=>x.classList.toggle("on",x.dataset.o===SAVE.infOp));
  $("#h-stage").classList.add("picking");$("#h-pick").classList.add("show");}
document.querySelectorAll(".hbtns button[data-p]").forEach(b=>b.onclick=()=>openPick(b.dataset.p));
function closePick(){$("#h-pick").classList.remove("show");$("#h-stage").classList.remove("picking");}
$("#h-back").onclick=closePick;
document.querySelectorAll(".ops button").forEach(b=>b.onclick=()=>{SAVE.infOp=b.dataset.o;save();document.querySelectorAll(".ops button").forEach(x=>x.classList.toggle("on",x===b));});
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>startPuzzle({from:"inf",type:pickType,mode:b.dataset.m,op:SAVE.infOp}));

/* ================= 起動 ================= */
soundBtns();
if(SAVE.unlocked&&SAVE.last==="inf")showHidden(false);else goTitle();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
